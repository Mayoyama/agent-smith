[project]
name = "agent-smith"
version = "0.1.0"
description = "Python coding agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.0",
]

# creates the sandbox command and points it to repl() in sandbox/repl.py (module.path:function)
[project.scripts]
sandbox = "sandbox.repl:repl"

# tells UV how to install the project as a package
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# hatchling looks for packages by name (list all top level packages here)
[tool.hatch.build.targets.wheel]
packages = ["sandbox", "common", "agent_mbpp", "agent_swebench", "swebench_tools"]
